  --accent:#3661ff; --accent-2:#7c5cff; --accent-glow:rgba(54,97,255,.20);
  --green:#17a673; --amber:#e08a1a; --red:#e5484d;

html,body{margin:0;padding:0;background:

ul{list-style:none;margin:0;padding:0;}
.app-shell{display:flex;flex-direction:column;min-height:100vh;}

.brand-mark{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 16px var(--accent-glow);}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
.brand-text{display:flex;flex-direction:column;line-height:1.1;}
.brand-name{font-weight:800;font-size:17px;letter-spacing:.5px;}
.brand-tag{font-size:10.5px;color:var(--text-faint);font-weight:500;}
.topnav-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.topnav-links a{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--text-dim);transition:.15s;}
.topnav-links a:hover{color:var(--text);background:var(--panel-2);}
.topnav-links a.active{color:#fff;background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--border);}
.topnav-right{display:flex;align-items:center;gap:10px;}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);color:var(--text-dim);border:1px solid var(--border-soft);}
.icon-btn:hover{color:var(--text);border-color:var(--accent);}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;background:var(--panel-2);border-radius:20px;border:1px solid var(--border-soft);font-size:13px;font-weight:600;}
.user-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
.page-content{flex:1;padding:28px 32px 60px;max-width:1440px;margin:0 auto;width:100%;}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:25px;font-weight:800;margin:0 0 4px;}
.page-subtitle{color:var(--text-dim);font-size:14px;margin:0;}
.section-title{font-size:15px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
.section-title i{color:var(--accent);}
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);}
.grid{display:grid;gap:18px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-1-2{grid-template-columns:1fr 2fr;}
.grid-2-1{grid-template-columns:2fr 1fr;}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3,.grid-2,.grid-1-2,.grid-2-1{grid-template-columns:1fr;}}
.stat-card{display:flex;flex-direction:column;gap:10px;}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.stat-icon.blue{background:rgba(54,97,255,.15);color:var(--accent);}
.stat-icon.green{background:rgba(23,166,115,.15);color:var(--green);}
.stat-icon.amber{background:rgba(224,138,26,.15);color:var(--amber);}
.stat-icon.red{background:rgba(229,72,77,.15);color:var(--red);}
.stat-value{font-size:30px;font-weight:800;}
.stat-label{color:var(--text-dim);font-size:13px;font-weight:500;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge.high,.badge.at-risk,.badge.critical{background:rgba(229,72,77,.15);color:var(--red);}
.badge.medium,.badge.warning{background:rgba(224,138,26,.15);color:var(--amber);}
.badge.low,.badge.on-track,.badge.recommendation{background:rgba(23,166,115,.15);color:var(--green);}
.badge.delayed{background:rgba(229,72,77,.15);color:var(--red);}
.badge.neutral{background:var(--panel-2);color:var(--text-dim);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.dot.high,.dot.red{background:var(--red);}
.dot.medium,.dot.amber{background:var(--amber);}
.dot.low,.dot.green{background:var(--green);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:700;border:none;cursor:pointer;transition:.15s;}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 22px var(--accent-glow);}

.btn-secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);}
.btn-sm{padding:7px 14px;font-size:12.5px;}
.btn-block{width:100%;}
.table{width:100%;border-collapse:collapse;}
.table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-faint);padding:10px 14px;border-bottom:1px solid var(--border-soft);}

.table tr:last-child td{border-bottom:none;}
.table tr.clickable{cursor:pointer;transition:background .15s;}
.table tr.clickable:hover{background:rgba(54,97,255,.06);}
.progress-track{width:100%;height:8px;border-radius:20px;background:var(--border-soft);overflow:hidden;}

.flow-track{display:flex;flex-direction:column;align-items:center;}

.text-dim{color:var(--text-dim);}

.error-box{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.35);color:var(--red);padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px;}
@media(max-width:900px){.sim-result-grid{grid-template-columns:1fr;}}
</style>

/* ================== RISK ENGINE (ported from risk_engine.py) ================== */
function daysRemaining(deadlineStr){
  const d = new Date(deadlineStr);
  const today = new Date("2026-09-04");
  return Math.round((d - today) / (1000*60*60*24));
}

function calculateRisk(p){
  let factors = [];
  let score = 0;

  const progressGap = Math.max(0, p.expectedProgress - p.progress);
  const progressComponent = Math.min(30, progressGap * 1.6);
  if (progressGap > 0) factors.push({label:"Low progress", detail:`Current progress is ${progressGap} points below the expected progress.`, weight: Math.round(progressComponent)});
  score += progressComponent;

  const totalRequired = p.resourceGaps.reduce((s,r)=>s+r.required,0) || 1;
  const totalGap = p.resourceGaps.reduce((s,r)=>s+Math.max(0, r.required-r.available),0);
  const shortageRatio = totalGap/totalRequired;
  const shortageComponent = Math.min(30, shortageRatio*60);
  if (totalGap > 0) factors.push({label:"Resource shortage", detail:`${totalGap} role(s) are understaffed relative to what the project needs.`, weight: Math.round(shortageComponent)});
  score += shortageComponent;

  const blockedTasks = p.tasks.filter(t=>t.blocked);
  const dependencyComponent = Math.min(25, blockedTasks.length*12);
  if (blockedTasks.length) factors.push({label:"Task dependency", detail:`${blockedTasks.length} critical task(s) are blocked or depend on a single owner.`, weight: Math.round(dependencyComponent)});
  score += dependencyComponent;

  const testingTasks = p.tasks.filter(t=>t.name.toLowerCase().includes("test"));
  let testingComponent = 0;
  if (testingTasks.length && testingTasks.every(t=>t.status==="Not Started")){
    testingComponent = 15;
    factors.push({label:"Testing delay", detail:"Testing has not started even though the deadline is approaching.", weight:testingComponent});
  }
  score += testingComponent;

  const daysLeft = daysRemaining(p.deadline);
  const remainingWork = 100 - p.progress;
  let externalComponent = 0;
  if (daysLeft < remainingWork*0.5){
    externalComponent = 10;
    factors.push({label:"External / schedule dependency", detail:`Only ${Math.max(daysLeft,0)} days remain for ${remainingWork}% of remaining work.`, weight:externalComponent});
  }
  score += externalComponent;

  const budgetUsedPct = p.budget ? (p.budgetUsed/p.budget)*100 : 0;
  if (budgetUsedPct - p.progress > 15){
    factors.push({label:"Budget overrun risk", detail:"Budget consumption is outpacing actual delivery progress.", weight:8});
    score += 8;
  }

  score = Math.max(0, Math.min(100, Math.round(score)));
  const level = score>=70 ? "HIGH" : score>=40 ? "MEDIUM" : "LOW";
  const predictedDelay = Math.max(0, Math.round((score/100)*14 + blockedTasks.length*1.5 + progressGap*0.1));

  const totalWeight = factors.reduce((s,f)=>s+f.weight,0) || 1;
  factors.forEach(f=> f.percent = Math.round((f.weight/totalWeight)*100));

  return {riskScore:score, riskLevel:level, predictedDelay, factors};
}

function generateRescuePlans(p, risk){
  const devGap = Math.max(1, (p.resourceGaps.find(r=>r.role==="Developer")||{required:1,available:0}).required - (p.resourceGaps.find(r=>r.role==="Developer")||{available:0}).available);
  const testerGap = Math.max(1, (p.resourceGaps.find(r=>r.role==="Tester")||{required:1,available:0}).required - (p.resourceGaps.find(r=>r.role==="Tester")||{available:0}).available);
  const riskScore = risk.riskScore, delay = risk.predictedDelay;

  const options = [
    {id:1, title:"Reallocate Resources", description:`Move ${devGap} developer(s) from a lower-priority project for 7 days.`,
     riskBefore:riskScore, riskAfter:Math.max(5,Math.round(riskScore*0.59)), delayBefore:delay, delayAfter:Math.max(0,Math.round(delay*0.42)), cost:0},
    {id:2, title:"Hire Temporary Resources", description:`Bring in ${devGap} Python developer(s) and ${testerGap} tester(s) on short-term contract.`,
     riskBefore:riskScore, riskAfter:Math.max(5,Math.round(riskScore*0.28)), delayBefore:delay, delayAfter:Math.max(0,Math.round(delay*0.17)), cost:devGap*60000+testerGap*30000},
    {id:3, title:"Reduce Low-Priority Scope", description:"Remove or defer 2 low-priority features from this release.",
     riskBefore:riskScore, riskAfter:Math.max(5,Math.round(riskScore*0.40)), delayBefore:delay, delayAfter:Math.max(0,Math.round(delay*0.25)), cost:0},
  ];
  const recommendation = {
    title:"Option 1 + Option 3",
    description:"Reallocate one developer and temporarily reduce low-priority scope. This provides the best balance between cost, deadline and project risk.",
    riskBefore:riskScore, riskAfter:Math.max(5,Math.round(riskScore*0.33)), delayBefore:delay, delayAfter:Math.max(0,Math.round(delay*0.17)), cost:0
  };
  return {options, recommendation};
}

function simulate(baseRisk, baseDelay, extraDevs, extraTesters, budgetIncrease, removeLowPriority, deadlineExtension){
  let risk = baseRisk, delay = baseDelay;
  for(let i=0;i<extraDevs;i++){ risk -= Math.max(6, 18-i*4); delay -= Math.max(1, 4-i); }
  for(let i=0;i<extraTesters;i++){ risk -= Math.max(4, 10-i*3); delay -= Math.max(0.5, 2-i*0.5); }
  if (removeLowPriority){ risk -= 12; delay -= 3; }
  if (budgetIncrease>0){ risk -= Math.min(8, budgetIncrease/50000); }
  if (deadlineExtension>0){ delay -= deadlineExtension; }
  risk = Math.max(3, Math.round(risk));
  delay = Math.max(0, Math.round(delay));
  const cost = extraDevs*60000 + extraTesters*30000 + Math.max(0,budgetIncrease);
  return {risk, delay, cost};
}

let currentRoute = "login";
let currentParams = {};
let simState = { devs:0, testers:0, budget:0, lowPriority:false, deadline:0 };
let simChartRef = null;

function navigate(route, params={}){
  currentRoute = route;
  currentParams = params;
  render();
  window.scrollTo(0,0);
}

function getProject(id){ return PROJECTS.find(p=>p.id===Number(id)); }

/* ================== RENDER ================== */
let shellBuilt = false;

function render(){
  const root = document.getElementById('root');
  if (!session.loggedIn){
    shellBuilt = false;
    root.innerHTML = renderLogin();
    attachLoginEvents();
    return;
  }

  if (!shellBuilt){
    // Build the app shell (nav + logo) exactly once per login session so it
    // never gets torn down and recreated while navigating between pages.
    root.innerHTML = `
      <div class="app-shell">
        ${renderNav()}
        <main class="page-content" id="pageContent"></main>
      </div>`;
    shellBuilt = true;
    attachShellEvents();
  } else {
    updateNavActiveState();
  }

  document.getElementById('pageContent').innerHTML = renderPage();
  attachPageEvents();
}

function updateNavActiveState(){
  document.querySelectorAll('.topnav-links [data-route]').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-route') === currentRoute);
  });
}

function attachShellEvents(){
  document.getElementById('logoutBtn').onclick = () => { session = {loggedIn:false, userName:""}; navigate("login"); };
  document.querySelectorAll('.topnav [data-route]').forEach(el=>{
    el.onclick = () => {
      const route = el.getAttribute('data-route');
      const params = JSON.parse(el.getAttribute('data-params') || '{}');
      navigate(route, params);
    };
  });
}

function renderNav(){
  const link = (route,label,icon,params={}) => `<a data-route="${route}" data-params='${JSON.stringify(params)}' class="${currentRoute===route?'active':''}"><i class="fa-solid ${icon}"></i> ${label}</a>`;
  return `
  <nav class="topnav">
    <div class="brand">
      <div class="brand-mark"><img src="${LOGO_SRC}" alt="ALLORA logo"></div>
      <div class="brand-text"><span class="brand-name">ALLORA</span><span class="brand-tag">Detect. Understand. Rescue.</span></div>
    </div>
    <div class="topnav-links">
      ${link('dashboard','Dashboard','fa-gauge-high')}
      ${link('projects','Projects','fa-diagram-project')}
      ${link('resources','Resources','fa-users-gear')}
      ${link('risk','Risk Analysis','fa-triangle-exclamation',{id:1})}
      ${link('simulator','What-If','fa-sliders',{id:1})}
      ${link('connections','Data Connections','fa-shield-halved')}
      ${link('settings','Settings','fa-gear')}
    </div>
    <div class="topnav-right">
      <a data-route="notifications" class="icon-btn"><i class="fa-solid fa-bell"></i></a>
      <div class="user-chip"><div class="user-avatar">${session.userName[0]}</div><span>${session.userName}</span></div>
      <a id="logoutBtn" class="icon-btn" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></a>
    </div>
  </nav>`;
}

function renderPage(){
  switch(currentRoute){
    case "dashboard": return renderDashboard();
    case "projects": return renderProjects();
    case "project": return renderProjectDetail(currentParams.id);
    case "risk": return renderRisk(currentParams.id);
    case "resources": return renderResources(currentParams.id);
    case "rescue": return renderRescue(currentParams.id);
    case "simulator": return renderSimulator(currentParams.id);
    case "connections": return renderConnections();
    case "notifications": return renderNotifications();
    case "settings": return renderSettings();
    default: return renderDashboard();
  }
}

function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="brand-mark"><img src="${LOGO_SRC}" alt="ALLORA logo"></div>
        <h1>ALLORA</h1>
        <p>AI-Powered Project Rescue &amp; Resource Intelligence</p>
      </div>
      <div id="loginError"></div>
      <form id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@company.com" required></div>
        <div class="field"><label>Password</label><input type="password" id="password" placeholder="••••••••" required></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <div class="divider">OR</div>
      <button id="demoLoginBtn" class="btn btn-secondary btn-block"><i class="fa-solid fa-bolt"></i> Demo Login</button>
      <div class="login-footer">Demo credentials: demo@allora.ai / demo123<br>Privacy-first · No account data is shared without consent</div>
    </div>
  </div>`;
}

function attachLoginEvents(){
  document.getElementById('demoLoginBtn').onclick = () => {
    session = { loggedIn:true, userName:"Demo Manager" };
    navigate("dashboard");
  };
  document.getElementById('loginForm').onsubmit = (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const pw = document.getElementById('password').value;
    if (email === "demo@allora.ai" && pw === "demo123"){
      session = { loggedIn:true, userName:"Demo Manager" };
      navigate("dashboard");
    } else {
      document.getElementById('loginError').innerHTML = `<div class="error-box"><i class="fa-solid fa-circle-exclamation"></i> Invalid email or password. Try the Demo Login button.</div>`;
    }
  };
}

function attachPageEvents(){
  document.querySelectorAll('#pageContent [data-route]').forEach(el=>{
    el.onclick = () => {
      const route = el.getAttribute('data-route');
      const params = JSON.parse(el.getAttribute('data-params') || '{}');
      navigate(route, params);
    };
  });
  runPageSpecificScripts();
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const total = PROJECTS.length;
  const onTrack = PROJECTS.filter(p=>p.status==="ON TRACK").length;
  const atRisk = PROJECTS.filter(p=>p.status==="AT RISK").length;
  const delayed = PROJECTS.filter(p=>p.status==="DELAYED").length;

  const riskSummary = {HIGH:0, MEDIUM:0, LOW:0};
  const alerts = [];
  PROJECTS.forEach(p=>{
    const r = calculateRisk(p);
    riskSummary[r.riskLevel]++;
    if (r.riskScore >= 60){
      const topFactor = r.factors[0] ? r.factors[0].detail : "Multiple risk factors detected.";
      alerts.push({project:p.name, id:p.id, risk:r.riskScore, level:r.riskLevel, message:topFactor});
    }
  });
  alerts.sort((a,b)=>b.risk-a.risk);
  const upcoming = [...PROJECTS].sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,6);

  return `
  <div class="page-header">
    <div><h1 class="page-title">Project Intelligence Dashboard</h1><p class="page-subtitle">Real-time overview of every project's health, risk and resourcing.</p></div>
    <a data-route="projects" class="btn btn-secondary"><i class="fa-solid fa-diagram-project"></i> View All Projects</a>

}

/* ================== PAGE-SPECIFIC SCRIPTS (charts + interactivity) ================== */
function runPageSpecificScripts(){
  if (currentRoute === "dashboard"){
    const total = PROJECTS.length;
    const atRisk = PROJECTS.filter(p=>p.status==="AT RISK").length;
    const delayed = PROJECTS.filter(p=>p.status==="DELAYED").length;
    const riskSummary = {HIGH:0, MEDIUM:0, LOW:0};
    PROJECTS.forEach(p=> riskSummary[calculateRisk(p).riskLevel]++ );

    new Chart(document.getElementById('healthChart'), {
      type:'line',
      data:{labels:['W1','W2','W3','W4','W5','W6','W7','W8'],
        datasets:[{label:'Portfolio Health Score', data:[78,76,74,71,69,68,65, Math.floor(100-((atRisk+delayed)/total*60))],
        borderColor:'#3661ff', backgroundColor:'rgba(54,97,255,.12)', fill:true, tension:.4, pointRadius:3, pointBackgroundColor:'#3661ff'}]},
      options:{plugins:{legend:{display:false}}, scales:{x:{grid:{color:'#e2e6f0'},ticks:{color:'#5b6478'}}, y:{grid:{color:'#e2e6f0'},ticks:{color:'#5b6478'},suggestedMin:40,suggestedMax:100}}}
    });
    new Chart(document.getElementById('riskChart'), {
      type:'doughnut',
      data:{labels:['High Risk','Medium Risk','Low Risk'], datasets:[{data:[riskSummary.HIGH,riskSummary.MEDIUM,riskSummary.LOW], backgroundColor:['#e5484d','#e08a1a','#17a673'], borderWidth:0}]},
      options:{plugins:{legend:{display:false}}, cutout:'68%'}
    });
  }

  if (currentRoute === "risk"){
    const p = getProject(currentParams.id); const r = calculateRisk(p);
    new Chart(document.getElementById('gaugeChart'), {
      type:'doughnut', data:{datasets:[{data:[r.riskScore,100-r.riskScore], backgroundColor:[riskColor(r.riskScore),'#e2e6f0'], borderWidth:0}]},
      options:{circumference:270, rotation:225, cutout:'75%', plugins:{legend:{display:false}, tooltip:{enabled:false}}}
    });
    new Chart(document.getElementById('factorChart'), {
      type:'bar', data:{labels:r.factors.map(f=>f.label), datasets:[{data:r.factors.map(f=>f.percent), backgroundColor:'#3661ff', borderRadius:6}]},
      options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{grid:{color:'#e2e6f0'},ticks:{color:'#5b6478'}}, y:{grid:{display:false},ticks:{color:'#161b28'}}}}
    });
  }

  if (currentRoute === "resources"){
    document.getElementById('resProjectSelect').onchange = (e) => navigate("resources", {id:Number(e.target.value)});
    new Chart(document.getElementById('workloadChart'), {
      type:'bar',
      data:{labels:RESOURCES.map(r=>r.name), datasets:[{label:'Workload %', data:RESOURCES.map(r=>r.workload),
        backgroundColor:RESOURCES.map(r=>r.workload>100?'#e5484d':r.workload>85?'#e08a1a':'#17a673'), borderRadius:6}]},
      options:{plugins:{legend:{display:false}}, scales:{x:{grid:{display:false},ticks:{color:'#5b6478'}}, y:{grid:{color:'#e2e6f0'},ticks:{color:'#5b6478'},suggestedMax:150}}}
    });
  }

  if (currentRoute === "connections"){
    document.querySelectorAll('[data-toggle-source]').forEach(btn=>{
      btn.onclick = () => { DATA_SOURCES[Number(btn.getAttribute('data-toggle-source'))].connected ^= true; render(); };
    });
  }

  if (currentRoute === "rescue"){
    const p = getProject(currentParams.id); const r = calculateRisk(p);
    const {recommendation} = generateRescuePlans(p, r);
    document.getElementById('applyRescueBtn').onclick = () => {
      document.getElementById('appliedBanner').innerHTML = `
        <div class="card" style="border-color:var(--green); background:rgba(23,166,115,.08); margin-bottom:18px;">
          <div style="display:flex;align-items:center;gap:12px;"><i class="fa-solid fa-circle-check" style="color:var(--green);font-size:20px;"></i>
          <div><strong>Rescue plan applied.</strong> The plan has been recorded and the team can begin execution.</div></div>
        </div>`;
      document.getElementById('applyRescueBtn').disabled = true;
      document.getElementById('applyRescueBtn').innerHTML = '<i class="fa-solid fa-check"></i> Applied';
    };
  }

  if (currentRoute === "simulator"){
    const p = getProject(currentParams.id); const r = calculateRisk(p);
    const baseline = {risk:r.riskScore, delay:r.predictedDelay};

    simChartRef = new Chart(document.getElementById('simChart'), {
      type:'bar',
      data:{labels:['Current','Simulated'], datasets:[
        {label:'Risk %', data:[baseline.risk, baseline.risk], backgroundColor:'#3661ff', borderRadius:6},
        {label:'Delay (days)', data:[baseline.delay, baseline.delay], backgroundColor:'#7c5cff', borderRadius:6}
      ]},
      options:{plugins:{legend:{labels:{color:'#5b6478'}}}, scales:{x:{grid:{display:false},ticks:{color:'#5b6478'}}, y:{grid:{color:'#e2e6f0'},ticks:{color:'#5b6478'}}}}
    });

    function runSim(){
      const s = simulate(baseline.risk, baseline.delay, simState.devs, simState.testers, simState.budget, simState.lowPriority, simState.deadline);
      document.getElementById('out-risk').innerText = s.risk + '%';
      document.getElementById('out-risk').style.color = riskColor(s.risk);
      document.getElementById('out-delay').innerText = s.delay + 'd';
      document.getElementById('out-cost').innerText = fmtMoney(s.cost);
      simChartRef.data.datasets[0].data = [baseline.risk, s.risk];
      simChartRef.data.datasets[1].data = [baseline.delay, s.delay];
      simChartRef.update();
    }

    document.getElementById('devsPlus').onclick = () => { simState.devs++; document.getElementById('devs-val').innerText = simState.devs; runSim(); };
    document.getElementById('devsMinus').onclick = () => { simState.devs = Math.max(0, simState.devs-1); document.getElementById('devs-val').innerText = simState.devs; runSim(); };
    document.getElementById('testersPlus').onclick = () => { simState.testers++; document.getElementById('testers-val').innerText = simState.testers; runSim(); };
    document.getElementById('testersMinus').onclick = () => { simState.testers = Math.max(0, simState.testers-1); document.getElementById('testers-val').innerText = simState.testers; runSim(); };
    document.getElementById('budget-range').oninput = (e) => { simState.budget = Number(e.target.value); document.getElementById('budget-sub').innerText = fmtMoney(simState.budget); runSim(); };
    document.getElementById('deadline-range').oninput = (e) => { simState.deadline = Number(e.target.value); document.getElementById('deadline-sub').innerText = e.target.value + ' days'; runSim(); };
    document.getElementById('low-priority-toggle').onclick = (e) => { simState.lowPriority = !simState.lowPriority; e.currentTarget.classList.toggle('on', simState.lowPriority); runSim(); };
  }
}

/* ================== INIT ================== */
render();
</script>
</body>
</html>
